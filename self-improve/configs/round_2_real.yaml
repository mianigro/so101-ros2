# Round 2 — real-robot self-improvement (supervised-assist). The same
# generate -> evaluate -> refine loop, but generation runs on the physical
# SO-101 with a human supervisor and the VLM judge:
#   1. session:  python self-improve/real_rollout.py session \
#                  --config self-improve/configs/round_2_real.yaml
#   2. post:     python self-improve/real_rollout.py post \
#                  --config self-improve/configs/round_2_real.yaml --interactive
#   3. refine:   python self-improve/run_round.py \
#                  --config self-improve/configs/round_2_real.yaml \
#                  --stages build,train \
#                  --real-dataset-repo-id local/so101_self_improve_round2_real
# checkpoint_in must point at the previous round's checkpoint directory
# (rounds/round_1/checkpoint/run/checkpoints/<step>/).
round_index: 2
phase: real
checkpoint_in: rounds/round_1/checkpoint/run/checkpoints/replace_me
rollout:
  task_prompt: pick up the cube and place it in the cup
  actions_per_chunk: 16
judge:
  name: vlm
  vlm_model_id: Qwen/Qwen3-VL-2B-Instruct
  confirm_human: true
  min_successes: 8
dataset:
  repo_prefix: local/so101_self_improve_round
  teleop_repo_ids:
    - algorithmtheworld/so101-pick-and-place
train:
  steps: 8000
  batch_size: 8
  save_steps: 4000
  policy_type: pi05
  init_from: previous
  base_repo_id: lerobot/pi05_base
  freeze_vision_encoder: true
  num_workers: 4
