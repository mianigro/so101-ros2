robot_type: "so101"
fps: 30

# Camera schemas come exclusively from --camera-profile. Wrist images drive frames.
reference_topic: "/follower/image_raw/compressed"
task: "Pick and Place"
default_max_age_s: 0.1

joint_names: &j
  - shoulder_pan
  - shoulder_lift
  - elbow_flex
  - wrist_flex
  - wrist_roll
  - gripper

features:
  - key: "observation.state"
    topic: "/follower/joint_states"
    msg_type: "sensor_msgs/msg/JointState"
    stamp_src: "bag"
    max_age_s: 0.05
    names: *j

  - key: "action"
    topic: "/follower/forward_controller/commands"
    msg_type: "std_msgs/msg/Float64MultiArray"
    stamp_src: "bag"
    max_age_s: 0.05
    names: *j
