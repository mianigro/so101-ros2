robot_type: "so101_bimanual"
fps: 30

# Camera schemas come exclusively from --setup. Absolute commands drive frames;
# the left follower's command topic is the reference tick.
reference_topic: "/follower_left/forward_controller/commands"
task: "Pick and Place"
default_max_age_s: 0.05

# Dataset column labels for the concatenated left+right vectors.
joint_names: &j
  - left.shoulder_pan
  - left.shoulder_lift
  - left.elbow_flex
  - left.wrist_flex
  - left.wrist_roll
  - left.gripper
  - right.shoulder_pan
  - right.shoulder_lift
  - right.elbow_flex
  - right.wrist_flex
  - right.wrist_roll
  - right.gripper

features:
  - key: "observation.state"
    topics:
      - "/follower_left/joint_states"
      - "/follower_right/joint_states"
    msg_type: "sensor_msgs/msg/JointState"
    stamp_src: "bag"
    max_age_s: 0.05
    names: *j

  - key: "action"
    topics:
      - "/follower_left/forward_controller/commands"
      - "/follower_right/forward_controller/commands"
    msg_type: "std_msgs/msg/Float64MultiArray"
    stamp_src: "bag"
    names: *j
