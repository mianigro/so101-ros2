# Round 1 — Phase 2 self-improvement: autonomous sim rollouts with the
# round-0 checkpoint, scripted success filtering, mixed co-training dataset,
# BC retrain, eval.  checkpoint_in must point at round 0's checkpoint
# directory (rounds/round_0/checkpoint/run/checkpoints/<step>/).
# Run: pixi shell -e lerobot
#      python pi05-self-improve/run_round --config pi05-self-improve/configs/round_1.yaml
round_index: 1
phase: sim
checkpoint_in: rounds/round_0/checkpoint/run/checkpoints/replace_me
rollout:
  task_id: SO101-Object-In-Cup-Vision-Fixed-v0
  task_prompt: pick up the cube and place it in the cup
  num_envs: 8
  num_episodes: 48
  max_episode_steps: 450
  actions_per_chunk: 16
  aggregate: weighted_average
  chunk_size_threshold: 0.3
  seed: 1
judge:
  name: scripted
  min_successes: 8
dataset:
  repo_prefix: local/so101_pi05_round
  teleop_repo_ids:
    - algorithmtheworld/so101-pick-and-place
train:
  steps: 8000
  batch_size: 8
  save_steps: 4000
  policy_type: pi05
  init_from: previous
  base_repo_id: lerobot/pi05_base
  freeze_vision_encoder: true
  num_workers: 4
eval:
  num_episodes: 24
