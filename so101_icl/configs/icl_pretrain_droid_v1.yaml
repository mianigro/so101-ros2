# Stage 1 — ICL pre-training on the DROID subset
base_checkpoint: lerobot/pi05_base
dtype: bfloat16
output_dir: so101_icl/runs/icl_pretrain_droid_v1
dataset:
  repo_id: lerobot/droid_1.0.1
  root: ~/.cache/huggingface/lerobot   # whatever download-subset fetched; registry follows the disk
  grouping_key: task_category    # 86 groups
  camera_rename: droid           # exterior_1->base_0_rgb, wrist->left_wrist_0_rgb, exterior_2->right_wrist_0_rgb
  demo_camera: observation.images.left_wrist_0_rgb   # droid "wrist" cam (see camera_rename).
                                  # REQUIRED demo angle — do not switch to exterior_1;
                                  # the keypoint cache must be built for this exact view.
  task_registry: so101_icl/configs/task_registry_droid.json
  task_cluster_cache: so101_icl/configs/task_registry_droid_clusters.json
                                 # rev 6: run `icl_data cluster-tasks --from-config
                                 # so101_icl/configs/icl_pretrain_droid_v1.yaml` first.
                                 # DROID task_category values are collection LOCATIONS
                                 # and exact task strings are unique per episode
                                 # (0.2% same-string packs) — supports are sampled
                                 # from the query's TASK CLUSTER instead.
  keypoint_cache: so101_icl/configs/task_registry_droid_kp.npz   # rev 6: 12 frames/demo — run
                                 # `icl_data precompute-keypoints --from-config
                                 # so101_icl/configs/icl_pretrain_droid_v1.yaml` first
                                 # (registry/camera/frames/output all come from this file)
  holdout_groups: {eval: 6, test: 6}   # 6+6 of 86 categories (the §6.1 plan): the M2
                                       # gate is a median over held-out groups — 3 would
                                       # make that a median of 3 numbers
  recompute_stats: auto          # recompute quantiles if the subset ships min/max only
demo_encoder: {k_max: 2, frames_per_demo: 12, tokens_vis: 64, tokens_traj: 32, traj_steps: 16, n_heads: 8,
               gate_floor: 0.3,          # rev 7: gates are now softmax logits sharing a fixed
                                 # budget (default = n_branches * gate_floor = 0.9), so
                                 # 0.3 is the per-branch loudness at the uniform init —
                                 # a branch can only get louder by taking share from the
                                 # others (kills the gate_kp runaway seen at lr_mult=50
                                 # and the lockstep drift, with no clamps or ceilings).
               keypoints: {enabled: true, n_kp: 16, kp_dim: 131, tokens_kp: 32}}   # rev 5 branch
lora: {rank: 32, alpha: 64, dropout: 0.01, targets: vlm_attention}
train:
  steps: 10000
  batch_per_gpu: 4      # 16 GB 4080s OOM at 8 during backward; accumulate instead
  grad_accum: 2         # effective batch = 4 * 2 * 2 GPUs = 16 (as before)
  lr: 5.0e-5
  warmup: 100
  grad_clip: 1.0
  gate_lr_mult: 75.0   # demo gates start at 0 and need a stronger push than the adapters.
                                # rev 9 fresh-run revision: raised from 50 — in the rev 8 run
                                # the gates stayed pinned at the 0.3 floor for 1500 steps
                                # while the demo ratio decayed (0.82 -> 0.99): too slow to
                                # open the pathway even with the hinge firing.
  ckpt_every: 1000   # crash cost == this interval (trainer state resumes mid-schedule)
  seed: 42
  num_workers: 8
  curriculum: [[100000000, [1, 2]]]   # k∈{1,2} from step 0 (rev 6): clusters made packs
                                      # task-aligned, so no k=1-only warmup phase; k=1
                                      # stays in the mix for single-demo missions
  demo_zeroed_every: 100
  language_dropout: 0.8         # rev 9 fresh-run revision: raised from 0.7 — the rev 8
                                # restart STILL slid from demo_ratio_bare 0.82 (step 500) to
                                # 0.99 (step 1500) with loss_demo_zeroed_bare flat: the model
                                # kept absorbing task identification through the prompt and
                                # unconditional competence. 80% of batches now make the demo
                                # pack the only task signal.
  demo_usage_weight: 6.0        # rev 9 fresh-run revision: raised from 4.0 — usage_loss sat
                                # at a tolerated ~0.02 steady state (hinge being paid, not
                                # obeyed). The stronger weight makes ignoring demos the
                                # expensive option again.
                                # rev 5 RoboTTT-style hinge: every step, penalize unless the
  demo_usage_margin: 0.02       # demo-conditioned loss beats the demo-zeroed replay by margin.
                                # Structural fix for the dead-saddle (gates nulling out) —
                                # ~1.4x step time (one extra no-grad forward).
  group_sampling: bursty        # rev 5 GEN-1.5/Chan et al.: Zipf-popularity task bursts
  burst_length: 4               # instead of uniform shuffle — the regime where ICL emerges
  val_every: 500                # best/ is selected on the held-out demo/zeroed ratio (rev 6)
eval:                            # offline defaults for `eval_icl.py offline`
  offline_trials: 500            # (CLI flags override)
  ablations: {k: [1, 2], frames: [6, 12]}   # k ≤ k_max; kp cache is 12-frame;
                                            # traj ablation removed (rev 8: no traj branch)
