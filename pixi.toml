[workspace]
name = "so101-ros-physical-ai"
description = "SO-101 ROS 2 stack tooling (Rerun bridge, utilities, dev env)"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[feature.bridge.dependencies]
python = "3.12.*"
pyyaml = ">=6.0.3,<7"
numpy = ">=2.4.2,<3"
gradio = ">=6.5.1,<7"

[feature.bridge.pypi-dependencies]
rerun-sdk = ">=0.31.3, <0.32"
gradio-rerun = ">=0.31.3, <0.32"


[feature.bridge.tasks]
# Run the bridge in a ROS-aware shell:
# - sources ROS Jazzy
# - sources your overlay (if built)
# - runs with pixi's python (so rerun is available)
# - forwards all extra args to the Python script
bridge = { cmd = "bash -c 'source /opt/ros/jazzy/setup.bash && source ${ROS_WS:-$HOME/ros2_ws}/install/setup.bash 2>/dev/null || true && exec python scripts/so101_ros2_to_rerun.py \"$@\"' -- " }
bridge-3d = { cmd = "bash -c 'source /opt/ros/jazzy/setup.bash && source ${ROS_WS:-$HOME/ros2_ws}/install/setup.bash 2>/dev/null || true && exec python scripts/so101_ros2_rerun_3d_bridge.py \"$@\"' -- " }
replay = { cmd = "bash -c 'source /opt/ros/jazzy/setup.bash && source ${ROS_WS:-$HOME/ros2_ws}/install/setup.bash 2>/dev/null || true && exec python scripts/so101_episode_viewer_ros2.py \"$@\"' -- " }
# Launch the native Rerun viewer (connect to a bridge with --connect)
viewer = { cmd = "python -m rerun" }


# --- Extra feature: LeRobot tooling (added as a second env) ---
[feature.lerobot.dependencies]
# LeRobot docs commonly recommend ffmpeg in the conda env
python = "3.12.*"
pyyaml = ">=6.0.3,<7"
numpy = ">=2.0,<2.3"
ffmpeg = "*"

[feature.lerobot.pypi-dependencies]
lerobot = { version = "==0.6.1", extras = ["async", "dataset", "dataset-viz", "pi", "smolvla", "training"] }
imageio = ">=2.34,<3"
msgpack = ">=1,<2"
pyzmq = ">=26.2.1,<28"
# so101_icl: manual LoRA injection on the frozen pi05 base (lerobot's own
# peft extra is not elected; we call peft directly, see so101_icl/lora.py)
peft = ">=0.18,<1.0"
# training dashboards (so101_icl/train_loop.py writes event files)
tensorboard = ">=2.14,<3"

[feature.lerobot.tasks]
lerobot-info = "lerobot-info"
convert = { cmd = "bash -c 'source /opt/ros/jazzy/setup.bash && source ${ROS_WS:-$HOME/ros2_ws}/install/setup.bash 2>/dev/null || true; export PYTHONPATH=\"${PIXI_PROJECT_ROOT}/rosbag_to_lerobot${PYTHONPATH:+:${PYTHONPATH}}\"; if [ \"${1-}\" = \"--\" ]; then shift; fi; exec python -m rosbag_to_lerobot.cli \"$@\"' --" }
infer = { cmd = "bash -c 'source /opt/ros/jazzy/setup.bash && source ${ROS_WS:-$HOME/ros2_ws}/install/setup.bash 2>/dev/null || true; export PYTHONPATH=\"${PIXI_PROJECT_ROOT}/so101_inference:${PIXI_PROJECT_ROOT}/rosbag_to_lerobot${PYTHONPATH:+:${PYTHONPATH}}\"; if [ \"${1-}\" = \"--\" ]; then shift; fi; exec python -m so101_inference.lerobot_inference_node \"$@\"' --" }
async_infer = { cmd = "bash -c 'source /opt/ros/jazzy/setup.bash && source ${ROS_WS:-$HOME/ros2_ws}/install/setup.bash 2>/dev/null || true; export PYTHONPATH=\"${PIXI_PROJECT_ROOT}/so101_inference:${PIXI_PROJECT_ROOT}/rosbag_to_lerobot${PYTHONPATH:+:${PYTHONPATH}}\"; if [ \"${1-}\" = \"--\" ]; then shift; fi; exec python -m so101_inference.async_inference_node \"$@\"' --" }
# so101_icl: demo-conditioned pi05 policy server (registers "pi05_icl" then
# runs the standard policy_server ZMQ main; demo side-channel on ICL_DEMO_PORT)
icl_server = { cmd = "bash -c 'export PYTHONPATH=\"${PIXI_PROJECT_ROOT}/so101_icl:${PIXI_PROJECT_ROOT}${PYTHONPATH:+:${PYTHONPATH}}\"; exec python so101_icl/serve_icl.py \"$@\"' --" }
# so101_icl data tooling (the python package lives under so101_icl/so101_icl,
# hence the PYTHONPATH; always run from the repo root so the config-relative
# registry paths resolve)
icl_data = { cmd = "bash -c 'export PYTHONPATH=\"${PIXI_PROJECT_ROOT}/so101_icl${PYTHONPATH:+:${PYTHONPATH}}\"; if [ \"${1-}\" = \"--\" ]; then shift; fi; exec python -m so101_icl.data \"$@\"' --" }
# so101_icl: rollout-wire policy server for the M3 sim campaign (registers
# "pi05_icl" in self_improve.rollout_server's whitelist + demo side channel)
icl_sim_server = { cmd = "bash -c 'export PYTHONPATH=\"${PIXI_PROJECT_ROOT}/so101_icl:${PIXI_PROJECT_ROOT}:${PIXI_PROJECT_ROOT}/self-improve${PYTHONPATH:+:${PYTHONPATH}}\"; exec python so101_icl/serve_rollout_icl.py \"$@\"' --" }
# so101_icl: M5 bridge node — rclpy entry point of the so101_icl_bridge
# package (ros2 launch so101_icl_bridge bridge_icl.launch.py after colcon
# build; this task runs the same main directly in a ROS shell)
icl_bridge = { cmd = "bash -c 'source /opt/ros/jazzy/setup.bash && source ${ROS_WS:-$HOME/ros2_ws}/install/setup.bash 2>/dev/null || true; export PYTHONPATH=\"${PIXI_PROJECT_ROOT}/so101_icl:${PIXI_PROJECT_ROOT}${PYTHONPATH:+:${PYTHONPATH}}\"; exec python so101_icl/so101_icl_bridge/so101_icl_bridge/bridge.py \"$@\"' --" }


# --- Environments ---
[environments]
# Default env: just the bridge tooling
default = ["bridge"]

# Second env: LeRobot
lerobot = ["lerobot"]
