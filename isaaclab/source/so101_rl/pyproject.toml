[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-rl"
version = "0.1.0"
description = "External Isaac Lab simulation environments for the local SO-101 robot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "coacd",
    "gymnasium>=1.2",
    "numpy>=2",
    "PyYAML>=6",
    "torch>=2.11",
    "trimesh",
    "usd-core>=25.11,<26; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
]

[project.scripts]
so101-prepare-assets = "so101_rl.asset_prep:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["so101_rl*"]
