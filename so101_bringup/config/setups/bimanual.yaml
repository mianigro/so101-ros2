# Bimanual setup: two leader/follower arm pairs (left and right), one wrist
# camera per follower, and one shared overhead camera between the arms.
# This file is the single source of truth for the rig: arm topology, logical
# camera contract, and physical devices. Isaac Sim is not supported for this
# setup (no sim section).
setup: bimanual
schema_version: 1

arms:
  leaders:
    - namespace: leader_left
      usb_port: /dev/so101_leader_left
      tf_xyz: [-0.5, -0.75, 0.0]
      tf_yaw_deg: 90.0
    - namespace: leader_right
      usb_port: /dev/so101_leader_right
      tf_xyz: [-0.5, -0.25, 0.0]
      tf_yaw_deg: 90.0
  followers:
    - namespace: follower_left
      usb_port: /dev/so101_follower_left
      tf_xyz: [-0.25, 0.0, 0.0]
      tf_yaw_deg: 0.0
    - namespace: follower_right
      usb_port: /dev/so101_follower_right
      tf_xyz: [0.25, 0.0, 0.0]
      tf_yaw_deg: 0.0

cameras:
  profile:
    - id: wrist_left
      node_name: cam_wrist
      namespace: follower_left
      image_topic: /follower_left/image_raw
      frame_id: follower_left/wrist_camera_optical_frame
      feature: wrist_left
      default_backend: gscam
    - id: wrist_right
      node_name: cam_wrist
      namespace: follower_right
      image_topic: /follower_right/image_raw
      frame_id: follower_right/wrist_camera_optical_frame
      feature: wrist_right
      default_backend: gscam
    - id: overhead_1
      node_name: cam_overhead_1
      namespace: static_camera_1
      image_topic: /static_camera_1/image_raw
      frame_id: static_camera_1_optical_frame
      feature: overhead_1
      default_backend: gscam
  rig:
    wrist_left:
      device: /dev/cam_wrist_left
    wrist_right:
      device: /dev/cam_wrist_right
    overhead_1:
      device: /dev/cam_overhead_1
